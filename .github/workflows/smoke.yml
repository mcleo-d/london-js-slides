name: CI Smoke Gate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  curly-quote-guard:
    name: Curly-quote guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for curly-quote JSX attribute delimiters
        run: python3 scripts/fix-curly-quotes.py --check

  smoke-check:
    name: Smoke check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run smoke check
        run: bash scripts/smoke-check.sh
