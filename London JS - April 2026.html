<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>London.js — April 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css">
<style>
  html, body { margin: 0; padding: 0; background: #0c0c0a; height: 100%; }
  body { font-family: "Inter Tight", system-ui, sans-serif; }
  deck-stage section { background: transparent; }
</style>
</head>
<body>

<deck-stage width="1920" height="1080">
  <section data-label="01 Title"><div id="s01"></div></section>
  <section data-label="02 Agenda"><div id="s02"></div></section>
  <section data-label="03 Wifi"><div id="s07"></div></section>
  <section data-label="04 Housekeeping"><div id="s03"></div></section>
  <section data-label="05 Host"><div id="s08"></div></section>
  <section data-label="06 Sponsor"><div id="s09"></div></section>
  <section data-label="07 By Numbers"><div id="s11"></div></section>
  <section data-label="08 Thanks"><div id="s10"></div></section>
  <section data-label="09 Talk 01"><div id="s04"></div></section>
  <section data-label="10 Talk 02"><div id="s05"></div></section>
  <section data-label="11 Talk 03"><div id="s06"></div></section>
</deck-stage>

<script src="deck-stage.js"></script>
<script src="reveals.js?v=6"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="slides.jsx?v=66"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel">
  const { useState, useEffect } = React;
  const S = window.Slides;

  const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
    "motorwaySize": 88,
    "omneaSize": 88,
    "partnersStyle": "stacked"
  }/*EDITMODE-END*/;

  // Mount static slides immediately.
  const staticMounts = [
    ['s02', S.S02_Agenda], ['s03', S.S03_Housekeeping],
    ['s04', S.S04_Talk1], ['s05', S.S05_Talk2], ['s06', S.S06_Talk3],
    ['s07', S.S07_Wifi], ['s08', S.S08_Host], ['s09', S.S09_Sponsor],
    ['s11', S.S11_ByNumbers],
    ['s10', S.S10_Thanks],
  ];
  for (const [id, Comp] of staticMounts) {
    const el = document.getElementById(id);
    if (el) ReactDOM.createRoot(el).render(<Comp />);
  }

  // Slide 01 + Tweaks panel share state, so they live in one App.
  function App() {
    const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
    return (
      <>
        <S.S01_Title
          motorwaySize={t.motorwaySize}
          omneaSize={t.omneaSize}
          partnersStyle={t.partnersStyle}
        />
        <TweaksPanel>
          <TweakSection label="Title slide — partner logos" />
          <TweakSlider label="Motorway size" value={t.motorwaySize}
            min={32} max={120} unit="px"
            onChange={(v) => setTweak('motorwaySize', v)} />
          <TweakSlider label="Omnea size" value={t.omneaSize}
            min={32} max={120} unit="px"
            onChange={(v) => setTweak('omneaSize', v)} />
          <TweakRadio label="Label style" value={t.partnersStyle}
            options={['stacked', 'inline']}
            onChange={(v) => setTweak('partnersStyle', v)} />
        </TweaksPanel>
      </>
    );
  }
  ReactDOM.createRoot(document.getElementById('s01')).render(<App />);
</script>
</body>
</html>
